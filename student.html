<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermana Academy - Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="school-logo"><img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/120x120?text=HA'"></div>
        <h1>🏫 Hermana Academy</h1>
        <div class="ethiopia"><div class="flag"><span class="green"></span><span class="yellow"></span><span class="red"></span></div><span>Student Portal</span></div>
        <button onclick="location.href='index.html'" style="margin-top: 10px;">← Back to Home</button>
    </div>

    <div id="studentAuth">
        <div class="grid-2">
            <div>
                <h2>📝 New Student Registration</h2>
                <form id="registerForm" enctype="multipart/form-data">
                    <div class="form-group"><label>Full Name *</label><input type="text" id="regName" required></div>
                    <div class="form-group"><label>Ethiopian ID *</label><input type="text" id="regEthiopianId" placeholder="ET1234567" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Leave empty for 'default'"></div>
                    <div class="form-group"><label>From Grade *</label><select id="regFromGrade">
                        <option value="Nursery">🎨 Nursery</option><option value="Lower KG">📖 Lower KG</option><option value="Upper KG">✏️ Upper KG</option>
                        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option>
                        <option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option>
                        <option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
                    </select></div>
                    <div class="form-group"><label>To Grade *</label><select id="regToGrade">
                        <option value="Nursery">🎨 Nursery</option><option value="Lower KG">📖 Lower KG</option><option value="Upper KG">✏️ Upper KG</option>
                        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option>
                        <option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option>
                        <option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
                    </select></div>
                    <div class="form-group"><label>Upload Your Photo *</label><input type="file" id="regPhoto" accept="image/*" required></div>
                    <button type="submit">Register →</button>
                </form>
            </div>
            <div>
                <h2>🔐 Login to Dashboard</h2>
                <form id="studentLoginForm">
                    <div class="form-group"><label>Ethiopian ID or Email</label><input type="text" id="studentIdentifier" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="studentPassword"></div>
                    <button type="submit">Login →</button>
                </form>
                <div class="card"><h3>📢 Demo Account</h3><p><strong>Student:</strong> ET999999 / student123</p></div>
            </div>
        </div>
    </div>
    <div id="studentDashboard" style="display: none;"></div>
</div>

<script src="script.js"></script>
<script>
    const API_URL = 'https://hermana-acad.onrender.com/api';
    let token = localStorage.getItem('token');
    let currentUser = null;
    let timeLeft = 60;

    async function apiCall(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        try {
            const res = await fetch(API_URL + endpoint, { ...options, headers });
            if (res.status === 401) logout();
            return res;
        } catch (error) { throw error; }
    }

    function logout() { localStorage.clear(); location.href = 'index.html'; }

    // Registration
    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('fullName', document.getElementById('regName').value);
        formData.append('ethiopianId', document.getElementById('regEthiopianId').value);
        formData.append('email', document.getElementById('regEmail').value);
        formData.append('grade', document.getElementById('regFromGrade').value);
        formData.append('fromGrade', document.getElementById('regFromGrade').value);
        formData.append('toGrade', document.getElementById('regToGrade').value);
        formData.append('password', document.getElementById('regPassword').value || 'default');
        const photo = document.getElementById('regPhoto').files[0];
        if (photo) formData.append('idPhoto', photo);
        
        try {
            const res = await fetch(API_URL + '/auth/register', { method: 'POST', body: formData });
            const data = await res.json();
            alert(res.ok ? '✅ Registration successful! Please login.' : '❌ Error: ' + data.error);
        } catch(err) { alert('Connection error'); }
    });

    // Login
    document.getElementById('studentLoginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const res = await fetch(API_URL + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    identifier: document.getElementById('studentIdentifier').value,
                    password: document.getElementById('studentPassword').value || 'default'
                })
            });
            const data = await res.json();
            if (res.ok) {
                token = data.token;
                currentUser = data.user;
                localStorage.setItem('token', token);
                await loadStudentDashboard();
            } else alert('Login failed: ' + data.error);
        } catch(err) { alert('Cannot connect to server.'); }
    });

    function startTimedExam(studentId, questions) {
        timeLeft = 60;
        const examHTML = `<div id="examContainer" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10001;overflow-y:auto;padding:30px;"><div style="max-width:800px;margin:0 auto;"><div class="timer-container"><div class="timer-clock" id="examTimer">01:00</div><div class="timer-warning">⚠️ Time remaining - Auto-submit at zero! ⚠️</div></div><form id="timedExamForm">${questions.map((q, i) => `<div style="margin-bottom:30px;padding:20px;background:#f8f9fa;border-radius:15px;"><h4>Question ${i+1}: ${q.text}</h4><div>${q.options.map((opt, oi) => `<label style="display:block;margin:10px 0;"><input type="radio" name="q${i}" value="${oi}" required> ${opt}</label>`).join('')}</div></div>`).join('')}<button type="submit" style="width:100%;padding:15px;">Submit Exam</button></form></div></div>`;
        document.body.insertAdjacentHTML('beforeend', examHTML);
        
        const timerElement = document.getElementById('examTimer');
        const timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
            if (timeLeft <= 10) timerElement.style.color = '#ff6b6b';
            if (timeLeft <= 0) { clearInterval(timerInterval); document.getElementById('timedExamForm').dispatchEvent(new Event('submit')); }
        }, 1000);
        
        document.getElementById('timedExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearInterval(timerInterval);
            const answers = [];
            for (let i = 0; i < questions.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                answers.push(selected ? parseInt(selected.value) : -1);
            }
            try {
                const res = await apiCall('/exam/submit', { method: 'POST', body: JSON.stringify({ studentId, answers, timeSpent: 60 - timeLeft, violations: 0 }) });
                const result = await res.json();
                alert(`Exam completed!\nScore: ${result.score}/${result.total} (${result.percentage}%)\n${result.passed ? '✅ Passed! Student ID generated.' : '❌ Failed! Retake exam.'}`);
                document.getElementById('examContainer').remove();
                loadStudentDashboard();
            } catch(err) { alert('Error submitting exam'); }
        });
    }

    async function loadStudentDashboard() {
        document.getElementById('studentAuth').style.display = 'none';
        const dashboard = document.getElementById('studentDashboard');
        dashboard.style.display = 'block';
        
        try {
            const studentRes = await apiCall(`/students/${currentUser.id}`);
            const student = await studentRes.json();
            const examRes = await apiCall(`/exam/${currentUser.id}`);
            const exam = await examRes.json();
            const payRes = await apiCall(`/payments/student/${currentUser.id}`);
            const payments = await payRes.json();
            
            let examHtml = '';
            if (!student.examCompleted) {
                examHtml = `<div class="card"><h3>⏰ Timed Ability Exam (${student.grade} Level)</h3><div class="timer-container"><div class="timer-clock">01:00</div><div class="timer-warning">You have 1 minute to complete the exam</div></div><button onclick="startTimedExam(${currentUser.id}, ${JSON.stringify(exam.questions).replace(/"/g, '&quot;')})" class="btn-success">⏰ Start Timed Exam →</button></div>`;
            }
            
            const examPassed = student.examPercent >= 50;
            dashboard.innerHTML = `
                <div class="dashboard-header"><div><h2>Welcome, ${student.fullName}!</h2><p>Ethiopian ID: ${student.ethiopianId} | Grade: ${student.grade}</p><button onclick="logout()" style="background:white;color:#667eea;">Logout</button></div></div>
                ${student.studentIdNumber ? `<div class="card" style="background:linear-gradient(135deg,#48bb78,#38a169);color:white"><h3>🎓 Your Student ID Number</h3><p style="font-size:24px;font-weight:bold">${student.studentIdNumber}</p></div>` : ''}
                <div class="id-card-container"><div class="id-card"><div class="id-card-ethiopia"></div><div class="id-logo"><div class="id-logo-left"><img src="logo.png" onerror="this.src='https://via.placeholder.com/60'"><small>Hermana Academy</small></div><div class="id-logo-center"><h3>የኸርማና አካዳሚ</h3><p>STUDENT ID CARD</p></div><div class="id-logo-right"><div class="flag-icon">🇪🇹</div></div></div><div class="id-photo"><img class="id-photo-img" src="${student.idPhotoUrl || 'https://via.placeholder.com/140'}" alt="Photo"></div><div class="id-details"><div class="id-row"><span class="id-label">Name:</span><span class="id-value">${student.fullName}</span></div><div class="id-row"><span class="id-label">Student ID:</span><span class="id-value">${student.studentIdNumber || 'Not Issued'}</span></div><div class="id-row"><span class="id-label">Ethiopian ID:</span><span class="id-value">${student.ethiopianId}</span></div><div class="id-row"><span class="id-label">Grade:</span><span class="id-value">${student.grade}</span></div></div><div class="id-footer">www.hermanaacademy.edu.et</div></div></div>
                ${examHtml}
                ${student.examCompleted ? `<div class="card"><h3>📊 Exam Result</h3><p>Score: ${student.examPercent}%</p><span class="badge ${examPassed ? 'badge-passed' : 'badge-failed'}">${examPassed ? 'PASSED' : 'FAILED'}</span></div>` : ''}
                ${examPassed ? `<div class="card"><h3>💰 Fee Payments</h3><div style="overflow-x:auto"><table><thead><tr><th>Package</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>
                    <tr><td>Registration Fee</span></td><td>1000 ETB</span><td class="${payments.paymentStatus?.registration ? 'badge-paid' : 'badge-unpaid'}">${payments.paymentStatus?.registration ? 'Paid' : 'Unpaid'}</span><td>${!payments.paymentStatus?.registration ? `<button onclick="showPaymentModal('registration',1000)">Pay Now</button>` : '✅'}</span></tr>
                    <tr>.<td>Term 1 + Bus</span><td>3500 ETB</span><td class="${payments.paymentStatus?.term1Bus ? 'badge-paid' : 'badge-unpaid'}">${payments.paymentStatus?.term1Bus ? 'Paid' : 'Unpaid'}</span><td>${!payments.paymentStatus?.term1Bus ? `<button onclick="showPaymentModal('term1Bus',3500)">Pay Now</button>` : '✅'}</span></tr>
                    <tr>.<td>Term 2 + Bus</span><td>3500 ETB</span><td class="${payments.paymentStatus?.term2Bus ? 'badge-paid' : 'badge-unpaid'}">${payments.paymentStatus?.term2Bus ? 'Paid' : 'Unpaid'}</span><td>${!payments.paymentStatus?.term2Bus ? `<button onclick="showPaymentModal('term2Bus',3500)">Pay Now</button>` : '✅'}</span></tr>
                    <tr>.<td>Term 3 + Bus</span><td>3500 ETB</span><td class="${payments.paymentStatus?.term3Bus ? 'badge-paid' : 'badge-unpaid'}">${payments.paymentStatus?.term3Bus ? 'Paid' : 'Unpaid'}</span><td>${!payments.paymentStatus?.term3Bus ? `<button onclick="showPaymentModal('term3Bus',3500)">Pay Now</button>` : '✅'}</span></tr>
                </tbody></div></div>` : '<div class="card"><h3>⚠️ Payment Unavailable</h3><p>You must pass the exam (50%+) to access payments.</p></div>'}
            `;
        } catch(err) { console.error(err); }
    }

    window.showPaymentModal = (type, amount) => {
        const modalHtml = `<div id="paymentModal" class="modal" style="display:flex"><div class="modal-content"><div class="modal-header"><h2>💰 Pay ${amount} ETB for ${type}</h2><button class="close-modal" onclick="closePaymentModal()">&times;</button></div><div class="modal-body"><form id="paymentForm" enctype="multipart/form-data"><div class="form-group"><label>Upload Payment Receipt *</label><input type="file" id="receiptImage" accept="image/*" required></div><div class="form-group"><label>Notes</label><textarea id="paymentNotes" rows="2"></textarea></div><button type="submit">Submit Receipt for Verification</button></form></div></div></div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('studentId', currentUser.id);
            formData.append('paymentType', type);
            formData.append('amount', amount);
            formData.append('notes', document.getElementById('paymentNotes').value);
            const receipt = document.getElementById('receiptImage').files[0];
            if (receipt) formData.append('receiptImage', receipt);
            
            try {
                const res = await fetch(API_URL + '/payment/submit-receipt', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                alert(res.ok ? '✅ Receipt submitted! Finance will verify it.' : 'Error: ' + data.error);
                closePaymentModal();
                loadStudentDashboard();
            } catch(err) { alert('Error submitting receipt'); }
        });
    };
    
    window.closePaymentModal = () => {
        const modal = document.getElementById('paymentModal');
        if (modal) modal.remove();
    };
    
    // Auto login check
    if (token) {
        const payload = JSON.parse(atob(token.split('.')[1]));
        currentUser = { id: payload.id, role: payload.role, name: payload.name };
        if (currentUser.role === 'student') loadStudentDashboard();
    }
</script>
</body>
</html>
